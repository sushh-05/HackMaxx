version: 1
applications:
  - appRoot: web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npx --yes bun@1.4.2 --version
            - npx --yes bun@1.4.2 install --frozen-lockfile
        build:
          commands:
            - npx --yes bun@1.4.2 --version
            - npx --yes bun@1.4.2 run --cwd web build
            - cp -R node_modules web/.next/node_modules
      artifacts:
        baseDirectory: web/.next
        files:
          - '**/*'
      cache:
        paths:
          - .bun/install/cache/**/*
