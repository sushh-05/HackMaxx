version: 1
frontend:
  env:
    variables:
      BUN_INSTALL: /root/.bun
      NEXT_PUBLIC_API_BASE_URL: https://c9y3l3wuma.execute-api.ap-south-1.amazonaws.com/dev
  phases:
    preBuild:
      commands:
        - npm config set fetch-retries 5
        - npm config set fetch-retry-mintimeout 20000
        - npm config set fetch-retry-maxtimeout 120000
        - npm install --global bun@1.4.2 --no-audit --no-fund
        - export PATH="$(npm prefix --global)/bin:$PATH"
        - bun --version
        - bun install --frozen-lockfile
    build:
      commands:
        - export PATH="$(npm prefix --global)/bin:$PATH"
        - bun --version
        - bun run --cwd web build
  artifacts:
    baseDirectory: web/.next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .bun/install/cache/**/*
      - web/.next/cache/**/*
