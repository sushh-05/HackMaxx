version: 1
frontend:
  env:
    variables:
      BUN_INSTALL: /root/.bun
  phases:
    preBuild:
      commands:
        - curl -fsSL https://bun.sh/install | bash
        - export BUN_INSTALL="$HOME/.bun"
        - export PATH="$BUN_INSTALL/bin:$PATH"
        - bun --version
        - bun install --frozen-lockfile
    build:
      commands:
        - export BUN_INSTALL="$HOME/.bun"
        - export PATH="$BUN_INSTALL/bin:$PATH"
        - bun --version
        - bun run --cwd web build
  artifacts:
    baseDirectory: web/out
    files:
      - '**/*'
  cache:
    paths:
      - .bun/install/cache/**/*
      - web/.next/cache/**/*
