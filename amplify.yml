version: 1
applications:
  - appRoot: web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npx --yes bun@1.4.2 --version
            - npx --yes bun@1.4.2 install --frozen-lockfile
        build:
          commands:
            - npx --yes bun@1.4.2 --version
            - npx --yes bun@1.4.2 run --cwd web build
            - rm -rf web/.next/amplify
            - mkdir -p web/.next/standalone/web/.next/static
            - cp -RL web/.next/static/. web/.next/standalone/web/.next/static/
            - mkdir -p web/.next/amplify
            - cp -RL web/.next/standalone/web/. web/.next/amplify/
      artifacts:
        baseDirectory: web/.next/amplify
        files:
          - '**/*'
      cache:
        paths:
          - .bun/install/cache/**/*
