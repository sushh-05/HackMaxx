version: 1
applications:
  - appRoot: web
    env:
      variables:
        BUN_INSTALL: /root/.bun
        AMPLIFY_MONOREPO_APP_ROOT: web
        NEXT_PUBLIC_API_BASE_URL: https://c9y3l3wuma.execute-api.ap-south-1.amazonaws.com/dev
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - rm -rf node_modules web/node_modules web/.next
            - npx --yes bun@1.4.2 --version
            - npx --yes bun@1.4.2 install --frozen-lockfile
        build:
          commands:
            - npx --yes bun@1.4.2 --version
            - npx --yes bun@1.4.2 run --cwd web build
      artifacts:
        baseDirectory: web/.next
        files:
          - '**/*'
      cache:
        paths:
          - .bun/install/cache/**/*
