version: 1
frontend:
  env:
    variables:
      BUN_INSTALL: /root/.bun
      NEXT_PUBLIC_API_BASE_URL: https://c9y3l3wuma.execute-api.ap-south-1.amazonaws.com/dev
  phases:
    preBuild:
      commands:
        - curl -fsSL https://bun.sh/install | bash
        - export PATH="/root/.bun/bin:$PATH"
        - bun --version
        - bun install --frozen-lockfile
    build:
      commands:
        - export PATH="/root/.bun/bin:$PATH"
        - bun --version
        - bun run --cwd web build
  artifacts:
    baseDirectory: web/.next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .bun/install/cache/**/*
      - web/.next/cache/**/*
