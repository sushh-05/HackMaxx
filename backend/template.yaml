AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  ComposioApiKey:
    Type: String
    NoEcho: true
    Default: ""
  ComposioGithubAuthConfigId:
    Type: String
    Default: "ac_tq4l5eu6qBHZ"
Description: HackMaxx — serverless backend (TS Lambda + DynamoDB + API GW)

Globals:
  Function:
    Runtime: nodejs20.x
    MemorySize: 256
    Timeout: 15
    Architectures: [x86_64]
    Environment:
      Variables:
        HACKATHONS_TABLE: !Ref HackathonsTable
        AWS_REGION_NAME: !Ref AWS::Region
        BEDROCK_EMBED_MODEL: amazon.titan-embed-text-v2:0
        BEDROCK_LLM_MODEL: anthropic.claude-3-haiku-20240307-v1:0
        COMPOSIO_API_KEY: !Ref ComposioApiKey
        COMPOSIO_GITHUB_AUTH_CONFIG_ID: !Ref ComposioGithubAuthConfigId
        WEB_APP_URL: "https://main.dspr7l982buda.amplifyapp.com"

Resources:
  HackathonsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub Hackathons-${AWS::StackName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: dev
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  ListFn:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: list.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HackathonsTable
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource: "*"
      Events:
        List:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /hackathons
            Method: get

  RecommendFn:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: recommend.handler
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HackathonsTable
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource: "*"
      Events:
        Recommend:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /recommend
            Method: post

  RefreshFn:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: refresh.handler
      Timeout: 60
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HackathonsTable
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource: "*"
      Environment:
        Variables:
          TINYFISH_API_KEY: ""
      Events:
        Refresh:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /hackathons/refresh
            Method: post

  HealthFn:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: health.handler
      Events:
        Health:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /healthz
            Method: get

  GithubConnectFn:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: github-connect.handler
      Events:
        GithubConnect:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /github/connect
            Method: post

  GithubReposFn:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: github-repos.handler
      Events:
        GithubRepos:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /github/repos
            Method: post

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/dev
