AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: HackMaxx — serverless backend (TS Lambda + DynamoDB + API GW)

Globals:
  Function:
    Runtime: nodejs20.x
    MemorySize: 256
    Timeout: 15
    Architectures: [x86_64]
    Environment:
      Variables:
        HACKATHONS_TABLE: !Ref HackathonsTable
        AWS_REGION_NAME: !Ref AWS::Region
        BEDROCK_EMBED_MODEL: amazon.titan-embed-text-v2:0
        BEDROCK_LLM_MODEL: anthropic.claude-3-haiku-20240307-v1:0

Resources:
  HackathonsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub Hackathons-${AWS::StackName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: dev
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  ListFn:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: list.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HackathonsTable
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource: "*"
      Events:
        List:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /hackathons
            Method: get

  RecommendFn:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: recommend.handler
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HackathonsTable
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource: "*"
      Events:
        Recommend:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /recommend
            Method: post

  RefreshFn:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: refresh.handler
      Timeout: 60
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HackathonsTable
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource: "*"
      Environment:
        Variables:
          TINYFISH_API_KEY: ""
      Events:
        Refresh:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /hackathons/refresh
            Method: post

  HealthFn:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: health.handler
      Events:
        Health:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /healthz
            Method: get

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/dev
