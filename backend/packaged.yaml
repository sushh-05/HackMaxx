AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: "HackMaxx \u2014 serverless backend (TS Lambda + DynamoDB + API GW)"
Globals:
  Function:
    Runtime: nodejs20.x
    MemorySize: 256
    Timeout: 15
    Architectures:
    - x86_64
    Environment:
      Variables:
        HACKATHONS_TABLE:
          Ref: HackathonsTable
        AWS_REGION_NAME:
          Ref: AWS::Region
        BEDROCK_EMBED_MODEL: amazon.titan-embed-text-v2:0
        BEDROCK_LLM_MODEL: anthropic.claude-3-haiku-20240307-v1:0
Resources:
  HackathonsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: Hackathons-${AWS::StackName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: id
        AttributeType: S
      KeySchema:
      - AttributeName: id
        KeyType: HASH
    Metadata:
      SamResourceId: HackathonsTable
  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: dev
      Cors:
        AllowMethods: '''GET,POST,OPTIONS'''
        AllowHeaders: '''Content-Type,Authorization'''
        AllowOrigin: '''*'''
    Metadata:
      SamResourceId: Api
  ListFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: s3://hackmaxx-sam-208588111867-ap-south-1/4b270a06968da0e1cec88bef7a540518
      Handler: list.handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: HackathonsTable
      - Statement:
        - Effect: Allow
          Action:
          - bedrock:InvokeModel
          Resource: '*'
      Events:
        List:
          Type: Api
          Properties:
            RestApiId:
              Ref: Api
            Path: /hackathons
            Method: get
    Metadata:
      SamResourceId: ListFn
  RecommendFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: s3://hackmaxx-sam-208588111867-ap-south-1/5b05b87fbe2f0de50227f7f9682e2d6f
      Handler: recommend.handler
      Timeout: 30
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: HackathonsTable
      - Statement:
        - Effect: Allow
          Action:
          - bedrock:InvokeModel
          Resource: '*'
      Events:
        Recommend:
          Type: Api
          Properties:
            RestApiId:
              Ref: Api
            Path: /recommend
            Method: post
    Metadata:
      SamResourceId: RecommendFn
  RefreshFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: s3://hackmaxx-sam-208588111867-ap-south-1/0ddc085ebe0b855ef04eaf01c3dae6c6
      Handler: refresh.handler
      Timeout: 60
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: HackathonsTable
      - Statement:
        - Effect: Allow
          Action:
          - bedrock:InvokeModel
          Resource: '*'
      Environment:
        Variables:
          TINYFISH_API_KEY: ''
      Events:
        Refresh:
          Type: Api
          Properties:
            RestApiId:
              Ref: Api
            Path: /hackathons/refresh
            Method: post
    Metadata:
      SamResourceId: RefreshFn
Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value:
      Fn::Sub: https://${Api}.execute-api.${AWS::Region}.amazonaws.com/dev
